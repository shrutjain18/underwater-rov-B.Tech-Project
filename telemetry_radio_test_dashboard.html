<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>433MHz Dashboard & Terminal</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .keys { display: flex; gap: 10px; margin-top: 15px; }
    .key { padding: 10px 16px; background: #334155; border-radius: 6px; font-family: monospace; font-weight: bold; }
    .key.active { background: #22c55e; color: #000; }
    /* Terminal Styles */
    #terminal {
      background: #000; color: #0f0; font-family: monospace; 
      height: 250px; overflow-y: auto; padding: 10px; 
      border-radius: 6px; margin-top: 10px; font-size: 13px;
    }
    .rx-text { color: #38bdf8; } /* Blue for incoming telemetry */
    .tx-text { color: #facc15; } /* Yellow for outgoing commands */
  </style>
</head>
<body>
  <div class="grid">
    <div class="card" style="grid-column: span 2; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2 style="margin:0;">Dashboard & Serial Tester</h2>
        <div id="status" style="color:#94a3b8; margin-top:5px;">Status: Disconnected</div>
      </div>
      <button onclick="connectSerial()">Connect Ground Radio</button>
    </div>

    <!-- Controls -->
    <div class="card">
      <h3 style="margin-top:0;">Test Controls</h3>
      <p style="color:#94a3b8; font-size:14px;">Press keys to trigger TX packets.</p>
      <div class="keys">
        <div id="keyW" class="key">W</div>
        <div id="keyS" class="key">S</div>
        <div id="keyA" class="key">A</div>
        <div id="keyD" class="key">D</div>
      </div>
    </div>

    <!-- Parsed Telemetry -->
    <div class="card">
      <h3 style="margin-top:0;">Live Parsed Data</h3>
      <p>Packet Count: <span id="tPkt" style="font-size:1.5rem; color:#38bdf8;">0</span></p>
      <p>Depth: <span id="tDepth">0.00 m</span> | Volts: <span id="tBatt">0.0 V</span></p>
    </div>

    <!-- NEW: Raw Serial Terminal -->
    <div class="card" style="grid-column: span 2;">
      <h3 style="margin-top:0; margin-bottom:0;">Live Serial Monitor</h3>
      <div id="terminal"></div>
    </div>
  </div>

<script>
  let port, writer;
  let keys = { KeyW:false, KeyS:false, KeyA:false, KeyD:false };

  // Keyboard handlers
  window.addEventListener('keydown', e => {
    if (keys.hasOwnProperty(e.code)) {
      keys[e.code] = true;
      document.getElementById(e.code.replace('Key','key')).classList.add('active');
    }
  });
  window.addEventListener('keyup', e => {
    if (keys.hasOwnProperty(e.code)) {
      keys[e.code] = false;
      document.getElementById(e.code.replace('Key','key')).classList.remove('active');
    }
  });

  // Terminal logging function
  function logTerminal(text, type) {
    const term = document.getElementById('terminal');
    const span = document.createElement('span');
    span.className = type === 'TX' ? 'tx-text' : 'rx-text';
    span.innerText = `[${type}] ${text}\n`;
    term.appendChild(span);
    term.scrollTop = term.scrollHeight; // Auto-scroll to bottom
  }

  async function connectSerial() {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 57600 });
      document.getElementById('status').innerText = 'Status: Connected @ 57600';
      document.getElementById('status').style.color = '#22c55e';
      
      writer = port.writable.getWriter();
      readLoop();
      setInterval(sendControlPacket, 250); // Send command every 250ms
    } catch (err) {
      alert('Error: ' + err);
    }
  }

  async function sendControlPacket() {
    if (!writer) return;
    let thr = (keys.KeyW ? 100 : 0) + (keys.KeyS ? -100 : 0);
    let yaw = (keys.KeyD ? 100 : 0) + (keys.KeyA ? -100 : 0);
    
    // Only format Thr and Yaw for this simple test
    let pkt = `CMD,${thr},${yaw},0,0\n`;
    await writer.write(new TextEncoder().encode(pkt));
    
    logTerminal(pkt.trim(), 'TX'); // Log outgoing command to HTML terminal
  }

  async function readLoop() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    const reader = textDecoder.readable.getReader();
    let buffer = '';
    
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let lines = buffer.split('\n');
      buffer = lines.pop(); // Keep incomplete line
      lines.forEach(line => {
        if(line.trim().length > 0) {
          logTerminal(line.trim(), 'RX'); // Log incoming telemetry to HTML terminal
          parseTelemetryLine(line);
        }
      });
    }
  }

  function parseTelemetryLine(line) {
    let data = {};
    line.trim().split(',').forEach(pair => {
      let parts = pair.split(':');
      if (parts.length === 2) data[parts[0]] = parts[1];
    });
    
    if (data.Depth !== undefined) document.getElementById('tDepth').innerText = data.Depth + ' m';
    if (data.BattV !== undefined) document.getElementById('tBatt').innerText = data.BattV + ' V';
    if (data.Pkt !== undefined) document.getElementById('tPkt').innerText = data.Pkt;
  }
</script>
</body>
</html>
